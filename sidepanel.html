<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My YouTube Comments</title>

    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
    <div id="video-info">
        <div id="video-title">
            タイトルを取得中...
        </div>
    </div>

    <h2>コメント</h2>

<button id="toggle-other-comments-button">
    その他のコメントを表示
</button>
<div id="comment-input-area">
    <textarea
        id="comment-input"
        placeholder="コメントを入力..."
        rows="4"
    ></textarea>

    <div id="comment-action-buttons">
        <button id="post-comment-button">
            投稿
        </button>

        <button id="cancel-edit-button" hidden>
            キャンセル
        </button>
    </div>
</div>

<div id="comments">
    コメントを取得中...
</div>

    <script src="sidepanel.js"></script>

</body>
</html>
